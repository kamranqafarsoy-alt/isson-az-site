<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ISSON GROUP məhsul kateqoriyaları və modelləri.">
<link rel="canonical" id="canonicalUrl" href="https://www.isson.az/category.html">

<title>ISSON Məhsullar</title>

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="./js/display-name.js"></script>

<style>

:root{
--gold:#bfa175;
--dark:#07090d;
--dark2:#10141a;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:
radial-gradient(circle at top left, rgba(191,161,117,.08), transparent 30%),
radial-gradient(circle at bottom right, rgba(191,161,117,.05), transparent 25%),
var(--dark);

color:white;
min-height:100vh;
}
header{
padding:30px 10%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
text-decoration:none;
font-size:2rem;
color:white;
font-family:'Marcellus',serif;
}

.logo span{
color:var(--gold);
}

.back-btn{
color:var(--gold);
text-decoration:none;
}

.hero{
padding:70px 10% 30px;
}

.hero h1{
font-size:3rem;
font-family:'Marcellus',serif;
color:var(--gold);
}

.hero-description{
max-width:760px;
margin-top:14px;
color:rgba(255,255,255,.68);
font-size:1rem;
line-height:1.75;
}

.products-grid{
padding:30px 10% 80px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.product-card{
background:rgba(255,255,255,.03);

border-radius:30px;

overflow:hidden;

border:1px solid rgba(191,161,117,.12);

box-shadow:
0 15px 45px rgba(0,0,0,.35);

transition:.4s;

text-decoration:none;
color:white;
}

.product-card:hover{
transform:translateY(-10px);

box-shadow:
0 25px 60px rgba(0,0,0,.5),
0 0 30px rgba(191,161,117,.08);
}
.product-card:hover{
transform:translateY(-8px);
}

.product-card img{
width:100%;
height:320px;
object-fit:contain;
background:#111827;
padding:15px;
}

.product-info{
padding:20px;
}

.product-info h3{
font-size:1.2rem;
margin-bottom:10px;
}

.empty{
text-align:center;
padding:80px;
color:#999;
}

.catalog-tools{
padding:0 10%;
display:grid;
gap:14px;
}

.catalog-tools input{
width:100%;
padding:17px 22px;
border-radius:50px;
background:#111827;
color:white;
font-size:16px;
outline:none;
border:1px solid rgba(191,161,117,.15);
}

.catalog-tools input:focus{
border-color:var(--gold);
box-shadow:0 0 20px rgba(191,161,117,.15);
}

.catalog-status{
color:rgba(255,255,255,.55);
font-size:.9rem;
}

.load-more-wrap{
grid-column:1/-1;
text-align:center;
padding-top:15px;
}

.load-more{
border:0;
border-radius:50px;
padding:14px 28px;
background:linear-gradient(135deg,#d7b98c,#bfa175);
color:#111;
font-weight:600;
cursor:pointer;
}

.product-card{position:relative}

.status-badge{
position:absolute;
top:16px;
right:16px;
z-index:2;
padding:7px 11px;
border-radius:50px;
background:var(--gold);
color:#111;
font-size:.72rem;
font-weight:700;
}

.status-badge.sold{background:#7f1d1d;color:white}

</style>
</head>

<body>

<header>
<a href="index.html" class="logo">ISS<span>ON</span></a>
<a href="index.html" class="back-btn">← Ana Səhifə</a>
</header>

<section class="hero">
<h1 id="pageTitle">Məhsullar</h1>
<p class="hero-description" id="pageDescription" hidden></p>
</section>

<div class="catalog-tools">
<input type="search" id="categorySearch" placeholder="Məhsul axtar..." aria-label="Məhsul axtar">
<p class="catalog-status" id="categoryStatus">Məhsullar yüklənir...</p>
</div>

<div class="products-grid" id="productsGrid"></div>

<script type="module">

import { supabase } from "./js/supabase.js";

const params = new URLSearchParams(window.location.search);
const category = params.get("cat");
const safe = value => String(value || "").replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[char]);

const names = {
kombi:"Kombilər",
kondisioner:"Kondisionerlər",
laminat:"Laminatlar",
qapi:"Otaq Qapıları",
moydadir:"Moydadırlar",
seyfqapilar:"Seyf Qapıları"
};

document.getElementById("pageTitle").textContent =
names[category] || "Məhsullar";

const canonicalUrl = document.getElementById("canonicalUrl");
canonicalUrl.href = category
? `https://www.isson.az/category.html?cat=${encodeURIComponent(category)}`
: "https://www.isson.az/category.html";

if(category === "kombi"){
    document.title = "Tempra Kombi Qiymətləri və Modelləri | ISSON GROUP";
    document.querySelector('meta[name="description"]').content =
    "Tempra kombiləri və digər aparıcı kombi markaları. Rəsmi zəmanət, satış və servis xidməti — ISSON GROUP.";
    const pageDescription = document.getElementById("pageDescription");
    pageDescription.textContent =
    "Tempra kombiləri və digər aparıcı kombi markaları — rəsmi zəmanət, satış və servis xidməti.";
    pageDescription.hidden = false;
}

async function loadProducts(){

let query = supabase
.from("products")
.select("*");

if(category === "qapi"){
    query = query
    .eq("category","qapi")
    .eq("subcategory","otaq-qapisi");
}
else if(category === "seyfqapilar"){
    query = query
    .eq("category","qapi")
    .eq("subcategory","seyf-qapisi");
}
else{
    query = query
    .eq("category",category);
}

const { data, error } = await query
.order("id",{ ascending:false });

if(error){
console.error(error);
return;
}

const grid =
document.getElementById("productsGrid");

if(!data || data.length===0){
grid.innerHTML =
'<div class="empty">Bu kateqoriyada məhsul yoxdur</div>';
return;
}

grid.innerHTML = "";

data.slice(0,24).forEach(item=>{

const image =
item.image ||
item.image_url ||
"images/no-image.jpg";
const productUrl = /tempra/i.test(item.name || item.title || "")
? "tempra-kombi.html"
: `product.html?id=${item.id}`;

grid.innerHTML += `
<a href="${productUrl}" class="product-card">

<img src="${safe(image)}" alt="${safe(item.name)}" loading="lazy">

<div class="product-info">
<h3>${safe(item.name)}</h3>
${item.price
? `<p>${safe(item.price)} ₼</p>`
: `<p>Qiymət üçün əlaqə saxlayın</p>`
}

</div>

</a>
`;
});

window.dispatchEvent(new CustomEvent("category-products-loaded",{
detail:data || []
}));

}

loadProducts();

</script>

<script>
window.addEventListener("category-products-loaded",(event)=>{
const allProducts = event.detail || [];
const grid = document.getElementById("productsGrid");
const search = document.getElementById("categorySearch");
const status = document.getElementById("categoryStatus");
const pageSize = 24;
let visibleCount = pageSize;

const escapeHtml = value => String(value || "").replace(/[&<>"']/g,char=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
})[char]);

function render(){
const value = search.value.trim().toLocaleLowerCase("az");
const filtered = allProducts.filter(item =>
`${item.name || ""} ${item.title || ""} ${item.description || ""}`
.toLocaleLowerCase("az")
.includes(value)
);
const visible = filtered.slice(0,visibleCount);
status.textContent = `${filtered.length} məhsul`;

if(!visible.length){
grid.innerHTML = '<div class="empty">Məhsul tapılmadı</div>';
return;
}

grid.innerHTML = visible.map(item=>{
const image = item.image || item.image_url || "images/ana-sehife.jpg";
const name = window.formatProductName(item.name || item.title || "Məhsul",item);
const price = item.price ? `${escapeHtml(item.price)} ₼` : "Qiymət üçün əlaqə saxlayın";
const productUrl = /tempra/i.test(name)
? "tempra-kombi.html"
: `product.html?id=${encodeURIComponent(item.id)}`;
const badge = item.status === "new"
? '<span class="status-badge">Yeni</span>'
: item.status === "sold"
? '<span class="status-badge sold">Satılıb</span>'
: "";
return `
<a href="${productUrl}" class="product-card">
${badge}
<img src="${escapeHtml(image)}" alt="${escapeHtml(name)}" loading="lazy">
<div class="product-info"><h3>${escapeHtml(name)}</h3><p>${price}</p></div>
</a>`;
}).join("");

if(visible.length < filtered.length){
grid.innerHTML += '<div class="load-more-wrap"><button type="button" class="load-more" id="loadMore">Daha çox göstər</button></div>';
document.getElementById("loadMore").addEventListener("click",()=>{
visibleCount += pageSize;
render();
});
}
}

search.addEventListener("input",()=>{
visibleCount = pageSize;
render();
});
render();
});
</script>

</body>
</html>
