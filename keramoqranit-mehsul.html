<style>
:root{--gold:#bfa175;--dark:#07090d}*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}body{background:var(--dark);color:#fff;min-height:100vh}header{padding:30px 8%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}.logo{font:2rem 'Marcellus',serif;color:#fff;text-decoration:none}.logo span,.back{color:var(--gold)}.back{text-decoration:none}.container{max-width:1200px;margin:auto;padding:40px 20px}.product{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.image-wrapper{position:relative;overflow:hidden;border-radius:30px}.counter{position:absolute;z-index:2;top:20px;right:20px;padding:8px 14px;border-radius:50px;background:rgba(0,0,0,.75)}#mainImage{display:block;width:100%;height:600px;object-fit:contain;background:#111827;border-radius:30px;padding:10px;cursor:zoom-in;transition:.35s}.image-wrapper:hover #mainImage{transform:scale(1.04)}h1{font:3rem 'Marcellus',serif;margin-bottom:20px}.price{font-size:2rem;color:var(--gold);margin-bottom:20px}.meta{margin-bottom:15px;color:#bbb;line-height:1.6}.actions{display:flex;gap:12px;margin-top:25px;flex-wrap:wrap}.btn{flex:1;min-width:180px;padding:15px 28px;border:0;border-radius:50px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.whatsapp{background:linear-gradient(135deg,#25d366,#1faa52);color:#fff}.share{background:linear-gradient(135deg,#bfa175,#d7b98c);color:#07090d}dialog{width:min(1100px,94vw);max-height:94vh;padding:0;border:0;border-radius:18px;background:#0b0e13}dialog::backdrop{background:rgba(0,0,0,.9)}dialog img{display:block;width:100%;max-height:92vh;object-fit:contain}.close{position:fixed;right:3vw;top:3vh;width:45px;height:45px;border:0;border-radius:50%;font-size:28px;cursor:pointer}@media(max-width:900px){.product{grid-template-columns:1fr}.container{padding:25px 16px}#mainImage{height:auto;max-height:70vh}h1{font-size:2.3rem}header{padding:24px 6%}}
</style>
</head>
<body>
<header><a href="index.html" class="logo">ISS<span>ON</span></a><a href="keramoqranit-kataloqu.html" class="back">← Geri</a></header>
<main class="container"><div class="product"><div class="image-wrapper"><span class="counter">1 / 1</span><img id="mainImage" alt="Keramoqranit məhsulu"></div><div><h1 id="title">Keramoqranit</h1><div class="price">Qiymət üçün əlaqə saxlayın</div><div class="meta">Kateqoriya: Keramoqranit</div><div class="meta">Məhsulun kodu, ölçüsü, səthi və istehsal məlumatları şəklin üzərində göstərilib.</div><div class="actions"><a class="btn whatsapp" id="whatsapp" target="_blank" rel="noopener">💬 WhatsApp</a><button class="btn share" id="share" type="button">🔗 Paylaş</button></div></div></div></main>
<dialog id="preview"><button class="close" id="close" type="button" aria-label="Bağla">×</button><img id="previewImage" alt=""></dialog>
<script>
const raw=new URLSearchParams(location.search).get('page')||'003';const num=Number(raw);const page=Number.isInteger(num)&&num>=3&&num<=437?String(num).padStart(3,'0'):'003';const filename=`Sumqayıt istehsalı Kataloq (Çanaqqala Seramik)_${page}.jpg`;const src='catalog-web/'+encodeURIComponent(filename);const title=`Keramoqranit — Səhifə ${page}`;document.title=title+' | ISSON GROUP';document.getElementById('title').textContent=title;const image=document.getElementById('mainImage');image.src=src;image.alt=title;const preview=document.getElementById('preview'),previewImage=document.getElementById('previewImage');image.addEventListener('click',()=>{previewImage.src=src;previewImage.alt=title;preview.showModal()});document.getElementById('close').addEventListener('click',()=>preview.close());preview.addEventListener('click',e=>{if(e.target===preview)preview.close()});const message=encodeURIComponent(`Salam, ${title} haqqında məlumat almaq istəyirəm. ${location.href}`);document.getElementById('whatsapp').href=`https://wa.me/994552000080?text=${message}`;document.getElementById('share').addEventListener('click',async()=>{if(navigator.share){await navigator.share({title,url:location.href})}else{await navigator.clipboard.writeText(location.href);document.getElementById('share').textContent='✓ Link kopyalandı'}});
</script>
