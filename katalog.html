    <section class="page-header">
        <h1>Ümumi Kataloq</h1>
        <p>Bütün məhsullarımız tək bir məkanda</p>
    </section>

    <section class="catalog-section">
      <div class="catalog-search">
    <input
        type="text"
        id="catalogSearch"
        placeholder="Məhsul axtar...">
</div>
        <div class="products-grid" id="umumi-kataloq">
            <p style="text-align: center; color: #888; width: 100%;">Məhsullar yüklənir...</p>
        </div>
    </section>

       <script src="script.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://qcnkjmnywapgnkbttznv.supabase.co',
  'SENIN_ANON_KEY'
)

const kataloqKonteyner =
document.getElementById('umumi-kataloq')

function showProducts(products){

  kataloqKonteyner.innerHTML = ''

  if(products.length === 0){
    kataloqKonteyner.innerHTML =
    '<p style="text-align:center;width:100%">Məhsul tapılmadı</p>'
    return
  }

  products.forEach(product => {

    const card = document.createElement('div')

    card.className = 'product-card'

    card.innerHTML = `
      <img
      src="${product.image_url || product.image || 'images/no-image.jpg'}"
      alt="${product.title || product.name}">

      <div class="product-overlay">
        <h3>${product.title || product.name}</h3>

        <p>${product.price || ''} ₼</p>

        <a
        href="product.html?id=${product.id}"
        class="btn btn-gold">
        Ətraflı
        </a>
      </div>
    `

    kataloqKonteyner.appendChild(card)

  })
}

async function loadCatalog(){

  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('id',{ ascending:false })

  if(error){
    kataloqKonteyner.innerHTML =
    '<p>Xəta baş verdi</p>'
    return
  }

  window.allProducts = data || []

  showProducts(window.allProducts)

  const searchInput =
  document.getElementById('catalogSearch')

  searchInput.addEventListener('input', () => {

    const value =
    searchInput.value.toLowerCase()

    const filtered =
    window.allProducts.filter(product =>

      (product.name || '')
      .toLowerCase()
      .includes(value)

      ||

      (product.title || '')
      .toLowerCase()
      .includes(value)

      ||

      (product.category || '')
      .toLowerCase()
      .includes(value)

    )

    showProducts(filtered)

  })

}

loadCatalog()
</script>

</body>
