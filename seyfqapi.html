<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seyf Qapıları — ISSON GROUP</title>

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
--bg-color:#fcfcfd;
--dark-luxury:#0b0e11;
--accent-gold:#c5a880;
--text-main:#2d3436;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:var(--bg-color);
color:var(--text-main);
}

.top-bar{
background:#050708;
color:white;
padding:12px 8%;
display:flex;
justify-content:space-between;
align-items:center;
font-size:.8rem;
border-bottom:1px solid rgba(197,168,128,.15);
}

.top-bar .phones{
display:flex;
gap:20px;
}

.top-bar i{
color:var(--accent-gold);
margin-right:5px;
}

header{
background:var(--dark-luxury);
padding:22px 8%;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
z-index:999;
}

.logo{
color:white;
font-family:'Marcellus',serif;
font-size:2rem;
letter-spacing:4px;
text-decoration:none;
}

.logo span{
color:var(--accent-gold);
}

.nav-links{
display:flex;
list-style:none;
gap:30px;
}

.nav-links a{
color:rgba(255,255,255,.8);
text-decoration:none;
font-size:.85rem;
text-transform:uppercase;
}

.nav-links a:hover,
.nav-links .active{
color:var(--accent-gold);
}

.page-header{
background:linear-gradient(rgba(11,14,17,.75),rgba(11,14,17,.75)),
url('images/hero-bg.jpg') center/cover;
padding:60px 20px;
text-align:center;
color:white;
}

.page-header h1{
font-family:'Marcellus',serif;
font-size:2.5rem;
letter-spacing:4px;
margin-bottom:10px;
}

.catalog-section{
padding:60px 8%;
}

.products-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.product-card{
background:white;
border:1px solid rgba(0,0,0,.05);
overflow:hidden;
border-radius:6px;
transition:.3s;
cursor:pointer;
text-decoration:none;
}

.product-card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.product-img-box{
height:420px;
display:flex;
align-items:center;
justify-content:center;
padding:15px;
background:white;
}

.product-img-box img{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.product-info{
padding:15px;
text-align:center;
}

.product-info h3{
font-size:16px;
color:#111;
}

footer{
background:#0b0e11;
color:white;
padding:40px;
margin-top:60px;
text-align:center;
}
</style>
</head>

<body>

<div class="top-bar">
<div><i class="fa-solid fa-location-dot"></i> Bakı, Azərbaycan</div>

<div class="phones">
<div><i class="fa-solid fa-phone"></i> TEMPRA: +994 50 800 00 80</div>
<div><i class="fa-solid fa-phone"></i> CONDO: +994 10 100 09 09</div>
</div>
</div>

<header>
<a href="index.html" class="logo">ISSON<span>GROUP</span></a>

<ul class="nav-links">
<li><a href="index.html">Ana Səhifə</a></li>
<li><a href="qapi.html">Otaq Qapıları</a></li>
<li><a href="seyfqapi.html" class="active">Seyf Qapıları</a></li>
</ul>
</header>

<section class="page-header">
<h1>Seyf Qapıları</h1>
<p>Təhlükəsizlik və premium dizayn</p>
</section>

<section class="catalog-section">
<div class="products-grid" id="seyf-kataloq"></div>
</section>

<footer>
© 2026 ISSON GROUP. Bütün hüquqlar qorunur.
</footer>

<script type="module">

import { supabase } from "./js/supabase.js";

async function loadSafeDoors(){

const { data, error } = await supabase
.from("products")
.select("*")
.eq("category","qapi")
.eq("subcategory","seyf-qapisi")
.order("id",{ ascending:false });

if(error){
console.error(error);
return;
}

const container =
document.getElementById("seyf-kataloq");

container.innerHTML = "";

data.forEach(item => {

container.innerHTML += `
<a href="product.html?id=${item.id}" class="product-card">

<div class="product-img-box">
<img src="${item.image || item.image_url}" alt="${item.name}">
</div>

<div class="product-info">
<h3>${item.name}</h3>
</div>

</a>
`;

});

}

loadSafeDoors();

</script>

</body>
</html>
