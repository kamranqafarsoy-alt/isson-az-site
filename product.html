<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Məhsul | ISSON GROUP</title>
  <meta name="description" content="ISSON GROUP məhsulu haqqında ətraflı məlumat və showroom əlaqəsi.">
  <meta name="theme-color" content="#171717">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Əsas məzmuna keç</a>
  <header class="site-header"><nav class="container nav" aria-label="Əsas naviqasiya"><a class="brand" href="index.html">ISSON GROUP<span>TEMPRA · CONDO</span></a><button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="main-menu" aria-label="Menyunu aç">☰</button><div class="nav-links" id="main-menu" data-menu><a href="index.html">Ana səhifə</a><a href="katalog.html">Kataloq</a><a href="index.html#showrooms">Showroomlar</a></div></nav></header>

  <main id="main">
    <section class="section">
      <div class="container" id="product" aria-live="polite">
        <div class="product-layout"><div class="skeleton" style="border-radius:18px"></div><div><div class="skeleton" style="min-height:280px;border-radius:18px"></div></div></div>
      </div>
    </section>
    <section class="section" id="relatedSection" hidden>
      <div class="container"><div class="section-head"><div><span class="eyebrow">Kəşf edin</span><h2>Oxşar məhsullar</h2></div></div><div class="product-grid" id="relatedGrid"></div></div>
    </section>
  </main>

  <div class="modal" id="storeModal" role="dialog" aria-modal="true" aria-labelledby="storeTitle">
    <div class="modal-card"><h2 id="storeTitle">Showroom seçin</h2><p>Məhsul haqqında WhatsApp vasitəsilə məlumat alın.</p><div class="store-list" id="storeList"></div><button class="button button-secondary" style="color:#171717;margin-top:16px;width:100%" type="button" data-close-modal>Bağla</button></div>
  </div>
  <div class="modal lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Məhsul şəklinin böyük görünüşü"><div class="modal-card"><img id="lightboxImage" alt=""><button class="skip-link" type="button" data-close-lightbox>Bağla</button></div></div>

  <footer class="site-footer"><div class="container"><div class="footer-grid"><div><a class="brand" href="index.html">ISSON GROUP<span>TEMPRA · CONDO</span></a></div><div><h3>Kataloq</h3><div class="footer-links"><a href="katalog.html">Bütün məhsullar</a><a href="index.html#categories">Kateqoriyalar</a></div></div><div><h3>Əlaqə</h3><div class="footer-links"><a href="tel:+994508000080">+994 50 800 00 80</a><a href="tel:+994101000909">+994 10 100 09 09</a></div></div></div><div class="footer-bottom">© <span data-year></span> ISSON GROUP.</div></div></footer>

  <script type="module">
    import "./assets/js/site.js";
    import { supabase } from "./js/supabase.js";
    import { STORES, escapeHtml, formatPrice, productCard } from "./assets/js/site.js";

    const id = new URLSearchParams(location.search).get("id");
    const root = document.getElementById("product");
    let currentProduct;
    let activeImage = "";

    function categoryLink(product) {
      if (product.category === "qapi" && product.subcategory === "seyf-qapisi") return "seyfqapilar";
      return product.category || "";
    }

    function openModal(modal) {
      modal.classList.add("active");
      modal.querySelector("button, a")?.focus();
    }
    function closeModal(modal) { modal.classList.remove("active"); }

    if (!id) {
      root.innerHTML = '<div class="state"><strong>Məhsul seçilməyib.</strong><br><a class="button" href="katalog.html" style="margin-top:16px">Kataloqa qayıt</a></div>';
    } else {
      const { data, error } = await supabase.from("products").select("*").eq("id", id).single();
      if (error || !data) {
        console.error(error);
        root.innerHTML = '<div class="state"><strong>Məhsul tapılmadı.</strong><br><a class="button" href="katalog.html" style="margin-top:16px">Kataloqa qayıt</a></div>';
      } else {
        currentProduct = data;
        const images = [data.image || data.image_url, data.image2, data.image3, data.image4].filter(Boolean);
        activeImage = images[0] || "images/ana-sehife.jpg";
        const name = data.name || data.title || "Məhsul";
        document.title = `${name} | ISSON GROUP`;
        document.querySelector('meta[name="description"]').content = (data.description || `${name} — ISSON GROUP kataloqu`).slice(0, 155);
        root.innerHTML = `
          <div class="product-layout">
            <div>
              <img class="product-main-image" id="mainImage" src="${escapeHtml(activeImage)}" alt="${escapeHtml(name)}" width="800" height="800">
              ${images.length > 1 ? `<div class="thumbs">${images.map((image, index) => `<button class="thumb ${index === 0 ? "active" : ""}" type="button" data-image="${escapeHtml(image)}" aria-label="${index + 1}-ci şəkli göstər"><img src="${escapeHtml(image)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
            </div>
            <div class="product-copy">
              <a class="eyebrow" href="category.html?cat=${encodeURIComponent(categoryLink(data))}">← Kateqoriyaya qayıt</a>
              <h1>${escapeHtml(name)}</h1>
              <div class="product-price">${formatPrice(data.price)}</div>
              <p class="product-description">${escapeHtml(data.description || "Bu məhsul haqqında ətraflı məlumat üçün showroomlarımızla əlaqə saxlayın.")}</p>
              <div class="actions"><button class="button" type="button" id="whatsappButton">WhatsApp-da soruş</button><a class="button button-secondary" style="color:#171717" href="tel:+994508000080">Zəng et</a></div>
            </div>
          </div>`;

        document.querySelectorAll(".thumb").forEach(button => button.addEventListener("click", () => {
          activeImage = button.dataset.image;
          document.getElementById("mainImage").src = activeImage;
          document.querySelectorAll(".thumb").forEach(item => item.classList.toggle("active", item === button));
        }));
        document.getElementById("mainImage").addEventListener("click", () => {
          const image = document.getElementById("lightboxImage");
          image.src = activeImage;
          image.alt = name;
          openModal(document.getElementById("lightbox"));
        });
        document.getElementById("whatsappButton").addEventListener("click", () => openModal(document.getElementById("storeModal")));

        let relatedQuery = supabase.from("products").select("*").neq("id", id);
        if (data.category) relatedQuery = relatedQuery.eq("category", data.category);
        if (data.subcategory) relatedQuery = relatedQuery.eq("subcategory", data.subcategory);
        relatedQuery = relatedQuery.limit(3);
        const { data: related } = await relatedQuery;
        if (related?.length) {
          document.getElementById("relatedSection").hidden = false;
          document.getElementById("relatedGrid").innerHTML = related.map(productCard).join("");
        }
      }
    }

    document.getElementById("storeList").innerHTML = STORES.map(store => {
      const name = currentProduct?.name || currentProduct?.title || "məhsul";
      const text = `Salam. ${name} haqqında ətraflı məlumat almaq istəyirəm. ${location.href}`;
      return `<a class="store-option" href="https://wa.me/${store.phone}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener"><span><strong>${store.name}</strong><br><small>${store.address}</small></span><span aria-hidden="true">→</span></a>`;
    }).join("");
    document.querySelectorAll("[data-close-modal]").forEach(button => button.addEventListener("click", () => closeModal(document.getElementById("storeModal"))));
    document.querySelectorAll("[data-close-lightbox]").forEach(button => button.addEventListener("click", () => closeModal(document.getElementById("lightbox"))));
    document.querySelectorAll(".modal").forEach(modal => modal.addEventListener("click", event => event.target === modal && closeModal(modal)));
    document.addEventListener("keydown", event => event.key === "Escape" && document.querySelectorAll(".modal.active").forEach(closeModal));
  </script>
</body>
</html>
