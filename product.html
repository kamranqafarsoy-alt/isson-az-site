<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Məhsul</title>

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--gold:#bfa175;
--dark:#07090d;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

body{
background:var(--dark);
color:white;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.product{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}

.product > div:first-child > img{
width:100%;
border-radius:25px;
}

h1{
font-family:'Marcellus',serif;
font-size:3rem;
margin-bottom:20px;
}

.price{
font-size:2rem;
color:#bfa175;
margin-bottom:20px;
}

.meta{
margin-bottom:15px;
color:#bbb;
}

.btn{
display:inline-block;
padding:15px 30px;
background:#25d366;
color:white;
text-decoration:none;
border-radius:50px;
margin-top:20px;
}

@media(max-width:900px){
.product{
grid-template-columns:1fr;
}
}
.gallery{
display:flex;
gap:12px;
margin-top:15px;
flex-wrap:wrap;
}

.thumb{
width:90px;
height:90px;

object-fit:cover;

border-radius:12px;

cursor:pointer;

border:2px solid rgba(191,161,117,.15);

transition:.3s;
}

.thumb:hover{
transform:scale(1.05);

border-color:#bfa175;
}

#mainImage{
width:100%;
height:600px;

object-fit:contain;

background:#111827;

border-radius:30px;

padding:10px;
}
.header{
position:sticky;
top:0;
z-index:999;

padding:20px 8%;

display:flex;
justify-content:space-between;
align-items:center;

background:rgba(7,9,13,.9);

backdrop-filter:blur(12px);

border-bottom:1px solid rgba(191,161,117,.08);
}

.logo{
text-decoration:none;
font-size:2rem;
font-family:'Marcellus',serif;
color:white;
}

.logo span{
color:#bfa175;
}

.back-btn{
text-decoration:none;
color:#bfa175;
font-weight:600;
}
</style>
</head>

<body>

<header class="header">

<a href="index.html" class="logo">
ISS<span>ON</span>
</a>

<a href="javascript:history.back()" class="back-btn">
← Geri
</a>

</header>

<div class="container">

<div id="product"></div>

</div>

<script type="module">

import { supabase } from "./js/supabase.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const { data,error } = await supabase
.from("products")
.select("*")
.eq("id",id)
.single();

if(data){

const image =
data.image ||
data.image_url ||
"images/no-image.jpg";

document.getElementById("product").innerHTML = `
<div class="product">

<div>

<img
id="mainImage"
src="${image}">

<div class="gallery">

${data.image ?
`<img class="thumb" src="${data.image}">`
: ''}

${data.image2 ?
`<img class="thumb" src="${data.image2}">`
: ''}

${data.image3 ?
`<img class="thumb" src="${data.image3}">`
: ''}

${data.image4 ?
`<img class="thumb" src="${data.image4}">`
: ''}

</div>

</div>

<div>

<h1>${data.name}</h1>

${data.price ?
`<div class="price">${data.price} ₼</div>`
:
`<div class="price">Qiymət üçün əlaqə saxlayın</div>`
}
<div class="meta">
Kateqoriya: ${data.category || '-'}
</div>
<div class="meta">
Alt Kateqoriya: ${data.subcategory || '-'}
</div>

${data.description ? `
<div class="meta">
${data.description}
</div>
` : ''}

<a
class="btn"

href="https://wa.me/994552000080?text=Salam,%20${encodeURIComponent(data.name)}%20məhsulu ilə maraqlanıram"
target="_blank">
WhatsApp ilə soruş
</a>

</div>

</div>
`;
document
.querySelectorAll(".thumb")
.forEach(img=>{

img.addEventListener("click",()=>{

document
.getElementById("mainImage")
.src = img.src;

});

});

}

</script>

<footer style="
text-align:center;
padding:40px 20px;
color:#777;
border-top:1px solid rgba(191,161,117,.08);
margin-top:80px;">
© 2026 ISSON. Bütün hüquqlar qorunur.
</footer>

</body>
</html>
