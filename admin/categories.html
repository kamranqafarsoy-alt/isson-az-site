<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kateqoriyalar - ISSON Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f14;
color:white;
padding:30px;
}

h1{
margin-bottom:25px;
color:#d7b98c;
}

.back{
display:inline-block;
margin-bottom:25px;
padding:12px 18px;
background:#d7b98c;
color:black;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:15px;
border:1px solid rgba(191,161,117,.15);
}

.card h3{
margin-bottom:15px;
color:#d7b98c;
}

.preview{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
background:#1f2937;
margin-bottom:15px;
}

input[type=file]{
width:100%;
padding:10px;
background:#1f2937;
border-radius:8px;
color:white;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#d7b98c;
color:black;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<a href="dashboard.html" class="back">
← Dashboard
</a>

<h1>Kateqoriyaları İdarə Et</h1>

<div id="categoriesGrid" class="grid"></div>

<script type="module">

import { supabase } from "../js/supabase.js";
import { requireAdmin } from "./auth.js";

await requireAdmin();

const {
    data:{user}
} = await supabase.auth.getUser();

if(!user){
    location.href="index.html";
}

async function loadCategories(){

    const { data,error } =
    await supabase
    .from("categories")
    .select("*")
    .order("id");
console.log(data);
    if(error){
        console.log(error);
        return;
    }

    const grid =
    document.getElementById("categoriesGrid");

    grid.innerHTML = "";

    data.forEach(cat=>{

        grid.innerHTML += `
        <div class="card">

            <h3>${cat.name}</h3>

           <img
class="preview"
src="${cat.image ? cat.image + '?v=' + Date.now() : 'https://placehold.co/600x400?text=No+Image'}">

            <input
            type="file"
            id="file-${cat.id}"
            accept="image/*">

            <button
            onclick="updateCategoryImage(${cat.id})">
            Şəkli Yenilə
            </button>

        </div>
        `;
    });
}

async function ensureKeramoqranitCategory(){
    const {data:existing,error:selectError} = await supabase
    .from("categories")
    .select("id")
    .eq("slug","keramoqranit")
    .maybeSingle();

    if(selectError){
        console.error(selectError);
        return;
    }

    if(existing) return;

    const image = "https://www.isson.az/catalog-web/Sumqay%C4%B1t%20istehsal%C4%B1%20Kataloq%20%28%C3%87anaqqala%20Seramik%29_003.jpg";
    const {error:insertError} = await supabase
    .from("categories")
    .insert({name:"Keramoqranit",slug:"keramoqranit",image});

    if(insertError) console.error(insertError);
}

window.updateCategoryImage = async function(id){

    const file =
    document.getElementById(`file-${id}`)
    .files[0];

    if(!file){
        alert("Şəkil seçin");
        return;
    }

    const fileName =
    "category-" +
    Date.now() +
    "-" +
    file.name;

    const { error:uploadError } =
    await supabase.storage
    .from("products")
    .upload(fileName,file,{
        upsert:true
    });

    if(uploadError){
        alert(uploadError.message);
        return;
    }

    const { data:urlData } =
    supabase.storage
    .from("products")
    .getPublicUrl(fileName);

    const imageUrl =
    urlData.publicUrl;

    const { error } =
    await supabase
    .from("categories")
    .update({
        image:imageUrl
    })
    .eq("id",id);

    if(error){
        alert(error.message);
        return;
    }

    alert("Şəkil yeniləndi");

    loadCategories();
}

await ensureKeramoqranitCategory();
loadCategories();

</script>

</body>
</html>
