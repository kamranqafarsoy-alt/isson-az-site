<!doctype html>
<html lang="az">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>İdarə paneli | ISSON GROUP</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="admin.css"></head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar"><a class="brand" href="dashboard.html">ISSON GROUP<span>ADMIN PANEL</span></a><nav class="admin-nav"><a class="active" href="dashboard.html">İcmal</a><a href="products.html">Məhsullar</a><a href="categories.html">Kateqoriyalar</a><button type="button" data-logout>Çıxış</button></nav></aside>
    <main class="admin-main"><div class="admin-head"><div><span class="eyebrow">İdarəetmə</span><h1>İcmal</h1></div><a class="button" href="products.html#form">Yeni məhsul</a></div><div class="admin-grid"><div class="admin-card metric"><span>Məhsullar</span><strong id="productCount">—</strong><a href="products.html">İdarə et →</a></div><div class="admin-card metric"><span>Kateqoriyalar</span><strong id="categoryCount">—</strong><a href="categories.html">İdarə et →</a></div><div class="admin-card metric"><span>Sayt</span><strong class="status">Aktiv</strong><a href="../index.html" target="_blank" rel="noopener">Sayta bax →</a></div></div></main>
  </div>
  <script type="module">
    import { supabase, requireAdmin, setupLogout } from "./admin.js";
    await requireAdmin(); setupLogout();
    const [products, categories] = await Promise.all([
      supabase.from("products").select("*", { count: "exact", head: true }),
      supabase.from("categories").select("*", { count: "exact", head: true })
    ]);
    document.getElementById("productCount").textContent = products.count ?? "—";
    document.getElementById("categoryCount").textContent = categories.count ?? "—";
  </script>
</body>
</html>
