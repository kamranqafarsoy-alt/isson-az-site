window.loadProducts = async function(){

const search =
document.getElementById("search")
.value
.toLowerCase();

const filter =
document.getElementById("filter")
.value;

const { data } =
await supabase
.from("products")
.select("*")
.order("id",{ascending:false});

const table =
document.getElementById("productsTable");

table.innerHTML="";

data.forEach(item=>{

if(
search &&
!(item.name || "")
.toLowerCase()
.includes(search)
){
return;
}

if(
filter &&
item.category !== filter
){
return;
}

table.innerHTML += `
<tr>

<td>
<img src="${
item.image ||
item.image_url ||
''
}">
</td>

<td>
${item.name || item.title}
</td>

<td>
${item.category || '-'}
</td>

<td>

<button
class="edit"
onclick="editProduct(${item.id})">
Redaktə
</button>

<button
class="delete"
onclick="deleteProduct(${item.id})">
Sil
</button>

</td>

</tr>
`;
});
}

window.deleteProduct =
async function(id){

if(!confirm("Silinsin?"))
return;

await supabase
.from("products")
.delete()
.eq("id",id);

loadProducts();
}

window.editProduct =
async function(id){

const ad =
prompt("Yeni ad");

if(!ad) return;

await supabase
.from("products")
.update({
name:ad,
title:ad
})
.eq("id",id);

loadProducts();
}

loadProducts();

</script>
