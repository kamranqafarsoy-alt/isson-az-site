<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Məhsullar - ISSON Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f14;
color:white;
padding:30px;
}

h1{
margin-bottom:20px;
color:#d7b98c;
}

.top{
display:flex;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

input,select{
padding:12px;
border:none;
border-radius:8px;
background:#1f2937;
color:white;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.add{
background:#d7b98c;
color:black;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
border-radius:10px;
overflow:hidden;
}

th,td{
padding:15px;
text-align:left;
border-bottom:1px solid #222;
}

th{
color:#d7b98c;
}

img{
width:60px;
height:60px;
object-fit:cover;
border-radius:8px;
}

.edit{
background:#f39c12;
}

.delete{
background:#c0392b;
color:white;
}
</style>
</head>

<body>

<h1>Məhsulların İdarə Edilməsi</h1>

<div style="background:#111827;padding:20px;border-radius:12px;margin-bottom:25px;">

<h3 style="margin-bottom:15px;color:#d7b98c">
Yeni Məhsul
<hr style="margin:30px 0;border-color:#333;">

<h3 style="margin-bottom:15px;color:#d7b98c">
Toplu Məhsul Əlavə Et
</h3>

<select id="bulkCategory">
    <option value="moydadir">Moydadır</option>
    <option value="laminat">Laminat</option>
    <option value="kombi">Kombi</option>
    <option value="kondisioner">Kondisioner</option>
</select>

<br><br>

<input
type="file"
id="bulkImages"
multiple
accept="image/*">

<br><br>

<select id="bulkSubcategory">
    <option value="">Alt Kateqoriya Seçin</option>
    <option value="otaq-qapisi">Otaq Qapısı</option>
    <option value="seyf-qapisi">Seyf Qapısı</option>
</select>

<br><br>

<button
class="add"
onclick="bulkUploadProducts()">
Toplu Yüklə
</button>
</h3>

<input
type="text"
id="name"
placeholder="Məhsul adı">

<br><br>

<select id="category">
<option value="kombi">Kombi</option>
<option value="kondisioner">Kondisioner</option>
<option value="laminat">Laminat</option>
<option value="qapi">Qapı</option>
<option value="moydadir">Moydadır</option>
</select>

<br><br>

<select id="subcategory">
<option value="">Alt Kateqoriya Seçin</option>
<option value="otaq-qapisi">Otaq Qapısı</option>
<option value="seyf-qapisi">Seyf Qapısı</option>
</select>
<br><br>

<input
type="number"
id="price"
placeholder="Qiymət (istəyə bağlı)">
<br><br>

<input
type="file"
id="productImage">

<br><br>

<input
type="file"
id="productImage2">

<br><br>

<input
type="file"
id="productImage3">

<br><br>

<input
type="file"
id="productImage4">

<br><br>

<textarea
id="description"
placeholder="Məhsul haqqında məlumat"
style="
width:100%;
height:120px;
padding:12px;
background:#1f2937;
color:white;
border:none;
border-radius:8px;">
</textarea>

<br><br>

<button
class="add"
id="addBtn">
Məhsul əlavə et
</button>
</div>

<div class="top">

<input
type="text"
id="search"
placeholder="Məhsul axtar...">

<select id="filter">
<option value="">Bütün kateqoriyalar</option>
<option value="kombi">Kombi</option>
<option value="kondisioner">Kondisioner</option>
<option value="laminat">Laminat</option>
<option value="qapi">Qapı</option>
<option value="moydadir">Moydadır</option>
</select>

</div>

<table>

<thead>
<tr>
<th>Şəkil</th>
<th>Ad</th>
<th>Kateqoriya</th>
<th>Alt Kateqoriya</th>
<th>Əməliyyat</th>
</tr>
</thead>

<tbody id="productsTable"></tbody>

</table>

<script type="module">

import { supabase } from "../js/supabase.js";

if(localStorage.getItem("isson_admin") !== "true"){
location.href="index.html";
}

async function loadProducts(){

const search =
document.getElementById("search")
.value
.toLowerCase();

const filter =
document.getElementById("filter")
.value;

const { data,error } =
await supabase
.from("products")
.select("*")
.order("id",{ascending:false});

if(error) return;

const table =
document.getElementById("productsTable");

table.innerHTML="";

data.forEach(item=>{

if(
search &&
!(item.name || "")
.toLowerCase()
.includes(search)
){
return;
}

if(
filter &&
item.category !== filter
){
return;
}

table.innerHTML += `
<tr>

<td>
<img src="${item.image || item.image_url || ''}">
</td>

<td>${item.name || ''}</td>

<td>${item.category || ''}</td>

<td>${item.subcategory || '-'}</td>

<td>

<button
class="edit"
onclick="editProduct(${item.id})">
Redaktə
</button>

<button
class="delete"
onclick="deleteProduct(${item.id})">
Sil
</button>

</td>

</tr>
`;

});

}

window.addProduct = async function(){

const name =
document.getElementById("name").value;
const category =
document.getElementById("category").value;

const subcategory =
document.getElementById("subcategory").value;

const price =
document.getElementById("price").value;

const description =
document.getElementById("description").value;

const file =
document.getElementById("productImage").files[0];

const file2 =
document.getElementById("productImage2").files[0];

const file3 =
document.getElementById("productImage3").files[0];

const file4 =
document.getElementById("productImage4").files[0];
if(!name){
alert("Məhsul adı daxil edin");
return;
}

let imageUrl="";
let imageUrl2="";
let imageUrl3="";
let imageUrl4="";
if(file){

const fileName =
Date.now() + "-" + file.name;

const { error: uploadError } =
await supabase
.storage
.from("products")
.upload(fileName,file,{
upsert:true
});

if(uploadError){
alert(uploadError.message);
return;
}

const { data } =
supabase
.storage
.from("products")
.getPublicUrl(fileName);

imageUrl =
data.publicUrl;
}
if(file2){

const fileName =
Date.now() + "-2-" + file2.name;

const { error: uploadError } =
await supabase.storage
.from("products")
.upload(fileName,file2,{
upsert:true
});

if(uploadError){
alert(uploadError.message);
return;
}

const { data } =
supabase.storage
.from("products")
.getPublicUrl(fileName);

imageUrl2 = data.publicUrl;
}

if(file3){

const fileName =
Date.now() + "-3-" + file3.name;

const { error: uploadError } =
await supabase.storage
.from("products")
.upload(fileName,file3,{
upsert:true
});

if(uploadError){
alert(uploadError.message);
return;
}

const { data } =
supabase.storage
.from("products")
.getPublicUrl(fileName);

imageUrl3 = data.publicUrl;
}

if(file4){

const fileName =
Date.now() + "-4-" + file4.name;

const { error: uploadError } =
await supabase.storage
.from("products")
.upload(fileName,file4,{
upsert:true
});

if(uploadError){
alert(uploadError.message);
return;
}

const { data } =
supabase.storage
.from("products")
.getPublicUrl(fileName);

imageUrl4 = data.publicUrl;
}
const { error } =
await supabase
.from("products")
.insert([{
name:name,
title:name,
category:category,
subcategory:subcategory,
price: price || null,
description:description,
image:imageUrl,
image_url:imageUrl,

image2:imageUrl2,
image3:imageUrl3,
image4:imageUrl4
}]);

if(error){
alert(error.message);
return;
}

alert("Məhsul əlavə edildi");

document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("productImage").value="";
document.getElementById("productImage2").value="";
document.getElementById("productImage3").value="";
document.getElementById("productImage4").value="";
loadProducts();
}

window.deleteProduct = async function(id){

if(!confirm("Silinsin?"))
return;

await supabase
.from("products")
.delete()
.eq("id",id);

loadProducts();
}

window.editProduct = async function(id){

const ad =
prompt("Yeni ad");

if(!ad) return;

await supabase
.from("products")
.update({
name:ad,
title:ad
})
.eq("id",id);

loadProducts();
}

document
.getElementById("addBtn")
.addEventListener("click", window.addProduct);

document
.getElementById("search")
.addEventListener("input", loadProducts);

document
.getElementById("filter")
.addEventListener("change", loadProducts);

loadProducts();

window.bulkUploadProducts = async function(){

    const files =
    document.getElementById("bulkImages").files;

    const category =
    document.getElementById("bulkCategory").value;



    if(files.length === 0){
        alert("Şəkil seçin");
        return;
    }

    let successCount = 0;

    for(const file of files){

        const fileName =
        Date.now() + "-" + file.name;

        const { error: uploadError } =
        await supabase.storage
        .from("products")
        .upload(fileName,file,{
            upsert:true
        });

        if(uploadError){
            console.log(uploadError);
            continue;
        }

        const { data } =
        supabase.storage
        .from("products")
        .getPublicUrl(fileName);

        const imageUrl =
        data.publicUrl;

        const productName =
        file.name
        .replace(".jpg","")
        .replace(".jpeg","")
        .replace(".png","");

        const { error } =
        await supabase
        .from("products")
        .insert([{
            name: productName,
            title: productName,
            category: category,
            subcategory: subcategory,
            image: imageUrl,
            image_url: imageUrl
        }]);

        if(!error){
            successCount++;
        }
    }

    alert(successCount + " məhsul əlavə edildi");

    loadProducts();
}

</script>

</body>
</html>
