<!doctype html>
<html lang="az">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Məhsullar | ISSON Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="admin.css"></head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar"><a class="brand" href="dashboard.html">ISSON GROUP<span>ADMIN PANEL</span></a><nav class="admin-nav"><a href="dashboard.html">İcmal</a><a class="active" href="products.html">Məhsullar</a><a href="categories.html">Kateqoriyalar</a><button type="button" data-logout>Çıxış</button></nav></aside>
    <main class="admin-main">
      <div class="admin-head"><div><span class="eyebrow">Kataloq</span><h1>Məhsullar</h1></div><button class="button" type="button" id="newButton">Yeni məhsul</button></div>

      <section class="admin-card" id="form" hidden>
        <div class="admin-head"><h2 id="formTitle" style="margin:0">Yeni məhsul</h2><button class="button button-secondary button-small" style="color:#171717" type="button" id="cancelButton">Bağla</button></div>
        <form id="productForm">
          <input type="hidden" id="productId">
          <div class="form-grid">
            <div class="form-group"><label for="name">Məhsul adı *</label><input class="field" id="name" required maxlength="120"></div>
            <div class="form-group"><label for="price">Qiymət (₼)</label><input class="field" id="price" type="number" min="0" step="0.01"></div>
            <div class="form-group"><label for="category">Kateqoriya *</label><select class="field" id="category" required></select></div>
            <div class="form-group"><label for="subcategory">Alt kateqoriya</label><select class="field" id="subcategory"><option value="">Yoxdur</option><option value="otaq-qapisi">Otaq qapısı</option><option value="seyf-qapisi">Seyf qapısı</option></select></div>
            <div class="form-group full"><label for="description">Təsvir</label><textarea class="field" id="description" maxlength="2500"></textarea></div>
            <div class="form-group full"><label for="images">Şəkillər (maksimum 4)</label><input class="field" id="images" type="file" accept="image/*" multiple><p class="help">Hər şəkil maksimum 8 MB. Redaktə zamanı yeni seçim mövcud qalereyanı əvəz edir.</p><div id="currentImages" class="thumbs"></div></div>
          </div>
          <div id="formNotice" class="notice" style="margin-top:16px" hidden></div>
          <div class="actions"><button class="button" id="saveButton" type="submit">Yadda saxla</button></div>
        </form>
      </section>

      <section class="admin-card" style="margin-top:20px">
        <div class="admin-toolbar"><input class="field" id="search" type="search" placeholder="Məhsul axtar..."><select class="field" id="filterCategory"><option value="">Bütün kateqoriyalar</option></select></div>
        <div class="table-wrap"><table class="admin-table"><thead><tr><th>Şəkil</th><th>Ad</th><th>Kateqoriya</th><th>Qiymət</th><th>Əməliyyat</th></tr></thead><tbody id="productRows"><tr><td colspan="5">Yüklənir...</td></tr></tbody></table></div>
      </section>
    </main>
  </div>
  <script type="module">
    import { supabase, requireAdmin, setupLogout, setBusy, uploadImage, removeStorageUrls } from "./admin.js";
    import { escapeHtml, formatPrice } from "../assets/js/site.js";
    await requireAdmin(); setupLogout();

    const formSection = document.getElementById("form");
    const form = document.getElementById("productForm");
    const rows = document.getElementById("productRows");
    const notice = document.getElementById("formNotice");
    let products = [], categories = [], editing = null;

    function imageUrls(product) { return [product.image || product.image_url, product.image2, product.image3, product.image4].filter(Boolean); }
    function categoryOptions() {
      const options = categories.map(item => `<option value="${escapeHtml(item.slug)}">${escapeHtml(item.name)}</option>`).join("");
      document.getElementById("category").innerHTML = `<option value="">Seçin</option>${options}`;
      document.getElementById("filterCategory").innerHTML = `<option value="">Bütün kateqoriyalar</option>${options}`;
    }
    function render() {
      const term = document.getElementById("search").value.trim().toLocaleLowerCase("az");
      const cat = document.getElementById("filterCategory").value;
      const shown = products.filter(item => (!cat || item.category === cat) && `${item.name || ""} ${item.title || ""}`.toLocaleLowerCase("az").includes(term));
      rows.innerHTML = shown.length ? shown.map(item => `
        <tr><td><img class="table-image" src="${escapeHtml(imageUrls(item)[0] || "../images/ana-sehife.jpg")}" alt=""></td>
        <td><strong>${escapeHtml(item.name || item.title)}</strong></td><td>${escapeHtml(item.category || "—")}</td><td>${formatPrice(item.price)}</td>
        <td><div class="table-actions"><button class="button button-small button-dark" type="button" data-edit="${item.id}">Redaktə</button><button class="button button-small button-danger" type="button" data-delete="${item.id}">Sil</button></div></td></tr>`).join("") : '<tr><td colspan="5">Nəticə tapılmadı.</td></tr>';
    }
    async function load() {
      const [productResult, categoryResult] = await Promise.all([
        supabase.from("products").select("*").order("id", { ascending: false }),
        supabase.from("categories").select("*").order("id")
      ]);
      if (productResult.error || categoryResult.error) { rows.innerHTML = '<tr><td colspan="5">Məlumatı yükləmək mümkün olmadı.</td></tr>'; return; }
      products = productResult.data || []; categories = categoryResult.data || []; categoryOptions(); render();
    }
    function openForm(product = null) {
      editing = product;
      form.reset();
      document.getElementById("productId").value = product?.id || "";
      document.getElementById("name").value = product?.name || product?.title || "";
      document.getElementById("price").value = product?.price ?? "";
      document.getElementById("category").value = product?.category || "";
      document.getElementById("subcategory").value = product?.subcategory || "";
      document.getElementById("description").value = product?.description || "";
      document.getElementById("formTitle").textContent = product ? "Məhsulu redaktə et" : "Yeni məhsul";
      document.getElementById("currentImages").innerHTML = imageUrls(product || {}).map(url => `<img src="${escapeHtml(url)}" alt="" style="aspect-ratio:1;object-fit:cover;border-radius:10px">`).join("");
      notice.hidden = true; formSection.hidden = false; formSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    document.getElementById("newButton").addEventListener("click", () => openForm());
    document.getElementById("cancelButton").addEventListener("click", () => { formSection.hidden = true; editing = null; });
    document.getElementById("search").addEventListener("input", render);
    document.getElementById("filterCategory").addEventListener("change", render);

    rows.addEventListener("click", async event => {
      const editButton = event.target.closest("[data-edit]");
      const deleteButton = event.target.closest("[data-delete]");
      if (editButton) openForm(products.find(item => String(item.id) === editButton.dataset.edit));
      if (deleteButton) {
        const product = products.find(item => String(item.id) === deleteButton.dataset.delete);
        if (!product || !confirm(`"${product.name || product.title}" məhsulu silinsin?`)) return;
        deleteButton.disabled = true;
        const { error } = await supabase.from("products").delete().eq("id", product.id);
        if (error) { alert(error.message); deleteButton.disabled = false; return; }
        await removeStorageUrls(imageUrls(product));
        products = products.filter(item => item.id !== product.id); render();
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("saveButton");
      const files = [...document.getElementById("images").files];
      if (files.length > 4) { notice.textContent = "Maksimum 4 şəkil seçə bilərsiniz."; notice.className = "notice error"; notice.hidden = false; return; }
      setBusy(button, true);
      try {
        let urls = imageUrls(editing || {});
        if (files.length) urls = await Promise.all(files.map(file => uploadImage(file)));
        const payload = {
          name: document.getElementById("name").value.trim(),
          title: document.getElementById("name").value.trim(),
          price: document.getElementById("price").value || null,
          category: document.getElementById("category").value,
          subcategory: document.getElementById("subcategory").value || null,
          description: document.getElementById("description").value.trim(),
          image: urls[0] || null, image_url: urls[0] || null, image2: urls[1] || null, image3: urls[2] || null, image4: urls[3] || null
        };
        const query = editing ? supabase.from("products").update(payload).eq("id", editing.id).select().single() : supabase.from("products").insert(payload).select().single();
        const { data, error } = await query;
        if (error) throw error;
        if (files.length && editing) await removeStorageUrls(imageUrls(editing));
        if (editing) products = products.map(item => item.id === data.id ? data : item); else products.unshift(data);
        render(); formSection.hidden = true; editing = null;
      } catch (error) {
        notice.textContent = error.message || "Əməliyyat baş tutmadı."; notice.className = "notice error"; notice.hidden = false;
      } finally { setBusy(button, false); }
    });
    await load();
  </script>
</body>
</html>
