<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin girişi | ISSON GROUP</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="../index.html">ISSON GROUP<span>ADMIN PANEL</span></a>
    <h1>Xoş gəlmisiniz</h1><p style="color:var(--muted)">Məhsul və kateqoriyaları idarə etmək üçün daxil olun.</p>
    <div id="notice" hidden></div>
    <form id="loginForm">
      <div class="form-group"><label for="email">E-poçt</label><input class="field" id="email" type="email" autocomplete="username" required></div>
      <div class="form-group"><label for="password">Şifrə</label><input class="field" id="password" type="password" autocomplete="current-password" minlength="6" required></div>
      <button class="button" id="loginButton" type="submit">Daxil ol</button>
    </form>
    <p class="help" style="margin-top:18px"><a href="../index.html">← Sayta qayıt</a></p>
  </main>
  <script type="module">
    import { supabase, redirectIfAuthenticated, setBusy } from "./admin.js";
    await redirectIfAuthenticated();
    const notice = document.getElementById("notice");
    const savedNotice = sessionStorage.getItem("admin_notice");
    if (savedNotice) { notice.textContent = savedNotice; notice.className = "notice"; notice.hidden = false; sessionStorage.removeItem("admin_notice"); }
    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = document.getElementById("loginButton");
      setBusy(button, true, "Yoxlanılır...");
      notice.hidden = true;
      const { error } = await supabase.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });
      if (error) {
        notice.textContent = "E-poçt və ya şifrə yanlışdır.";
        notice.className = "notice error"; notice.hidden = false; setBusy(button, false);
      } else location.replace("dashboard.html");
    });
  </script>
</body>
</html>
